<svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <defs>
        <linearGradient id="agentHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
        <linearGradient id="agentVisorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="agentChestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>
    </defs>

    <!-- 顶部智能感知天线 (Top Sensory Antenna) -->
    <path d="M512 80 L512 210" stroke="#6366f1" stroke-width="32" stroke-linecap="round"/>
    <circle cx="512" cy="80" r="36" fill="#f43f5e"/>
    <circle cx="512" cy="80" r="14" fill="#ffffff"/>

    <!-- 侧翼 MCP 协议接口引脚 (Side Interface Connectors) -->
    <rect x="70" y="440" width="80" height="36" rx="18" fill="#38bdf8"/>
    <rect x="70" y="520" width="80" height="36" rx="18" fill="#818cf8"/>
    <rect x="874" y="440" width="80" height="36" rx="18" fill="#38bdf8"/>
    <rect x="874" y="520" width="80" height="36" rx="18" fill="#818cf8"/>

    <!-- 智能体头部机甲轮廓 (Agent Head Chassis - 纯净通透底色) -->
    <polygon points="512,170 860,330 860,690 512,870 164,690 164,330" 
             fill="url(#agentHeadGrad)" 
             stroke="#38bdf8" 
             stroke-width="24" 
             stroke-linejoin="round"/>

    <!-- 极客扫描视窗 (Cyber Visor - 高对比亮青色) -->
    <polygon points="230,420 794,420 754,550 270,550" 
             fill="#0f172a" 
             stroke="#38bdf8" 
             stroke-width="16" 
             stroke-linejoin="round"/>
    <line x1="280" y1="485" x2="744" y2="485" stroke="url(#agentVisorGrad)" stroke-width="28" stroke-linecap="round"/>
    <circle cx="410" cy="485" r="18" fill="#ffffff"/>
    <circle cx="614" cy="485" r="18" fill="#ffffff"/>

    <!-- 标志性 "A" 智能体核心结晶 (Iconic "A" Core) -->
    <path d="M512 600 L400 780" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
    <path d="M512 600 L624 780" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
    <line x1="440" y1="720" x2="584" y2="720" stroke="#38bdf8" stroke-width="24" stroke-linecap="round"/>
    <circle cx="512" cy="600" r="26" fill="#38bdf8"/>
    <circle cx="512" cy="600" r="12" fill="#ffffff"/>
</svg>
