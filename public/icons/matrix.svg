<svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <defs>
        <linearGradient id="matrixGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="50%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="matrixGradSurface" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60A5FA"/>
            <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="matrixGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E3A8A"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="matrixGradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#818CF8"/>
        </linearGradient>
    </defs>

    <!-- 背景技术罗盘环与刻度 -->
    <circle cx="512" cy="512" r="440" fill="none" stroke="url(#matrixGradPrimary)" stroke-width="8" stroke-dasharray="16 20" opacity="0.35"/>
    <circle cx="512" cy="512" r="380" fill="none" stroke="url(#matrixGradPrimary)" stroke-width="4" opacity="0.25"/>

    <!-- 坐标准心与导向射线 -->
    <line x1="512" y1="40" x2="512" y2="160" stroke="url(#matrixGradGlow)" stroke-width="12" stroke-linecap="round"/>
    <line x1="512" y1="864" x2="512" y2="984" stroke="url(#matrixGradGlow)" stroke-width="12" stroke-linecap="round"/>
    <line x1="40" y1="512" x2="160" y2="512" stroke="url(#matrixGradGlow)" stroke-width="12" stroke-linecap="round"/>
    <line x1="864" y1="512" x2="984" y2="512" stroke="url(#matrixGradGlow)" stroke-width="12" stroke-linecap="round"/>

    <!-- 底层架构基座 (Foundation Isometric Plate) -->
    <path d="M512 620 L220 460 L512 300 L804 460 Z" fill="url(#matrixGradDark)" opacity="0.85"/>
    <path d="M220 460 L512 620 V690 L220 530 Z" fill="#1E293B" opacity="0.9"/>
    <path d="M512 620 L804 460 V530 L512 690 Z" fill="#0F172A" opacity="0.95"/>
    <path d="M512 620 L220 460 L512 300 L804 460 Z" fill="none" stroke="url(#matrixGradPrimary)" stroke-width="8" opacity="0.6"/>

    <!-- 中层矩阵栅格 (Matrix Grid Layer) -->
    <g transform="translate(0, -90)">
        <path d="M512 550 L270 410 L512 270 L754 410 Z" fill="url(#matrixGradDark)" opacity="0.9"/>
        <path d="M270 410 L512 550 V600 L270 460 Z" fill="#1D4ED8" opacity="0.7"/>
        <path d="M512 550 L754 410 V460 L512 600 Z" fill="#1E3A8A" opacity="0.8"/>
        <!-- 内部 2x2 矩阵网格分割线 -->
        <path d="M391 340 L633 480 M633 340 L391 480" stroke="url(#matrixGradGlow)" stroke-width="6" opacity="0.75"/>
        <path d="M512 550 L270 410 L512 270 L754 410 Z" fill="none" stroke="url(#matrixGradSurface)" stroke-width="8"/>
    </g>

    <!-- 顶层核心决策水晶 (Apex Decision Prism) -->
    <g transform="translate(0, -180)">
        <!-- 上菱形顶面 -->
        <path d="M512 470 L340 370 L512 270 L684 370 Z" fill="url(#matrixGradSurface)"/>
        <!-- 左侧高光折面 -->
        <path d="M340 370 L512 470 V540 L340 440 Z" fill="#2563EB"/>
        <!-- 右侧阴影折面 -->
        <path d="M512 470 L684 370 V440 L512 540 Z" fill="#1D4ED8"/>
        <!-- 晶体边线高光 -->
        <path d="M512 270 L340 370 L512 470 L684 370 Z" fill="none" stroke="#93C5FD" stroke-width="8" stroke-linejoin="round"/>
        <path d="M512 470 V540" stroke="#BFDBFE" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- 核心光芒节点与四维指引微星 (Navigation Stars) -->
    <path d="M512 40 L528 75 L565 90 L528 105 L512 140 L496 105 L459 90 L496 75 Z" fill="#38BDF8"/>
    <circle cx="512" cy="90" r="8" fill="#FFFFFF"/>

    <!-- 矩阵连接线与高光粒子 -->
    <circle cx="340" cy="190" r="14" fill="#06B6D4"/>
    <circle cx="684" cy="190" r="14" fill="#8B5CF6"/>
    <circle cx="200" cy="460" r="12" fill="#3B82F6"/>
    <circle cx="824" cy="460" r="12" fill="#6366F1"/>
    <circle cx="512" cy="740" r="16" fill="#38BDF8"/>
</svg>
