<svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <defs>
        <linearGradient id="matrixTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="matrixMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        <linearGradient id="matrixBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
    </defs>

    <!-- 底层架构基座 (Foundation Plate - 通透靛蓝) -->
    <g transform="translate(0, 160)">
        <polygon points="512,500 170,330 512,160 854,330" fill="url(#matrixBaseGrad)" stroke="#c7d2fe" stroke-width="16" stroke-linejoin="round"/>
        <polygon points="170,330 512,500 512,580 170,410" fill="#3730a3"/>
        <polygon points="512,500 854,330 854,410 512,580" fill="#312e81"/>
    </g>

    <!-- 中层工程矩阵 (Engineering Matrix - 科技亮蓝) -->
    <g transform="translate(0, 50)">
        <polygon points="512,440 220,290 512,140 804,290" fill="url(#matrixMidGrad)" stroke="#bfdbfe" stroke-width="18" stroke-linejoin="round"/>
        <polygon points="220,290 512,440 512,520 220,370" fill="#1d4ed8"/>
        <polygon points="512,440 804,290 804,370 512,520" fill="#1e40af"/>
        <!-- 矩阵网格切割线 -->
        <line x1="366" y1="215" x2="658" y2="365" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        <line x1="658" y1="215" x2="366" y2="365" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- 顶层核心决策水晶 (Apex Decision Core - 纯净青蓝折面) -->
    <g transform="translate(0, -70)">
        <!-- 上折面 -->
        <polygon points="512,380 280,240 512,100 744,240" fill="url(#matrixTopGrad)" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
        <!-- 左侧面 -->
        <polygon points="280,240 512,380 512,470 280,330" fill="#0284c7"/>
        <!-- 右侧面 -->
        <polygon points="512,380 744,240 744,330 512,470" fill="#0369a1"/>
        <!-- 晶棱高光 -->
        <line x1="512" y1="100" x2="512" y2="380" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- 顶端指引星芒 (Apex Star) -->
    <polygon points="512,0 528,38 566,54 528,70 512,108 496,70 458,54 496,38" fill="#38bdf8"/>
    <circle cx="512" cy="54" r="10" fill="#ffffff"/>
</svg>
