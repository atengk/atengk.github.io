<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="zenithGradSurfaceTop" x1="60" y1="40" x2="196" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="zenithGradSurfaceLeft" x1="40" y1="120" x2="128" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <linearGradient id="zenithGradSurfaceRight" x1="128" y1="120" x2="216" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="zenithGradGlow" x1="128" y1="30" x2="128" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- 主体群组：纯净透亮三层水晶矩阵 (零滤镜模糊、零暗角) -->
  <g>
    <!-- 底层晶格切面 (Foundation Layer) -->
    <g transform="translate(0, 48)">
      <path d="M128 160L46 118L128 76L210 118L128 160Z" fill="url(#zenithGradSurfaceTop)" opacity="0.6" stroke="#c7d2fe" stroke-width="1.5" />
      <path d="M46 118L128 160V176L46 134V118Z" fill="url(#zenithGradSurfaceLeft)" opacity="0.75" />
      <path d="M128 160L210 118V134L128 176V160Z" fill="url(#zenithGradSurfaceRight)" opacity="0.75" />
    </g>

    <!-- 中层沉浸矩阵 (Matrix Layer) -->
    <g transform="translate(0, 24)">
      <path d="M128 140L54 102L128 64L202 102L128 140Z" fill="url(#zenithGradSurfaceTop)" opacity="0.85" stroke="#e0e7ff" stroke-width="2" />
      <path d="M54 102L128 140V156L54 118V102Z" fill="url(#zenithGradSurfaceLeft)" opacity="0.9" />
      <path d="M128 140L202 102V118L128 156V140Z" fill="url(#zenithGradSurfaceRight)" opacity="0.9" />
    </g>

    <!-- 顶层天顶巅峰核心 (Zenith Apex Core) -->
    <g>
      <!-- 顶面钻石光泽 -->
      <path d="M128 120L62 86L128 52L194 86L128 120Z" fill="url(#zenithGradSurfaceTop)" stroke="#ffffff" stroke-width="2.5" />
      <!-- 左切面 -->
      <path d="M62 86L128 120V140L62 106V86Z" fill="url(#zenithGradSurfaceLeft)" />
      <!-- 右切面 -->
      <path d="M128 120L194 86V106L128 140V120Z" fill="url(#zenithGradSurfaceRight)" />

      <!-- 顶棱高光线 -->
      <path d="M128 52L62 86L128 120L194 86L128 52Z" stroke="url(#zenithGradGlow)" stroke-width="3" stroke-linejoin="round" />
      <path d="M128 120V140" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 天顶纯白星芒与明亮粒子 (Sharp Apex Sparkles - 纯矢量无模糊) -->
    <g>
      <!-- 顶点光芒菱形 -->
      <path d="M128 20L133 36L149 41L133 46L128 62L123 46L107 41L123 36Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="128" cy="41" r="3.5" fill="#ffffff" />

      <!-- 环绕微星 -->
      <circle cx="68" cy="62" r="4" fill="#ec4899" />
      <circle cx="188" cy="62" r="4" fill="#06b6d4" />
      <circle cx="216" cy="118" r="3" fill="#a855f7" />
      <circle cx="40" cy="118" r="3" fill="#6366f1" />
    </g>
  </g>
</svg>
