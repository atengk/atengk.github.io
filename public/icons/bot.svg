<svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <defs>
        <linearGradient id="botChassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="botVisorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="50%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
        <linearGradient id="botBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="botCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
    </defs>

    <!-- 顶部协议天线与飞剑感光信标 (Top Antenna / Celestial Beacon) -->
    <path d="M512 80 L512 210" stroke="#3b82f6" stroke-width="28" stroke-linecap="round"/>
    <polygon points="512,50 540,110 512,95 484,110" fill="url(#botBladeGrad)"/>
    <circle cx="512" cy="140" r="18" fill="#38bdf8"/>
    <circle cx="512" cy="140" r="8" fill="#ffffff"/>

    <!-- 两侧高频无头 Socket 接口引脚 (Side Socket Connectors) -->
    <rect x="74" y="440" width="76" height="34" rx="17" fill="#38bdf8"/>
    <rect x="74" y="520" width="76" height="34" rx="17" fill="#818cf8"/>
    <rect x="874" y="440" width="76" height="34" rx="17" fill="#38bdf8"/>
    <rect x="874" y="520" width="76" height="34" rx="17" fill="#818cf8"/>

    <!-- 机器人机身外壳 (Bot Chassis - 凌厉八角装甲轮廓) -->
    <polygon points="512,180 850,330 850,710 512,890 174,710 174,330" 
             fill="url(#botChassisGrad)" 
             stroke="#38bdf8" 
             stroke-width="24" 
             stroke-linejoin="round"/>

    <!-- 内部深邃扫描显示视窗 (Cyber Visor Display) -->
    <polygon points="240,420 784,420 740,560 284,560" 
             fill="#0f172a" 
             stroke="#38bdf8" 
             stroke-width="16" 
             stroke-linejoin="round"/>

    <!-- 视窗内部拟人流光与感知阵列 (Visor Flow Line & Sensors) -->
    <line x1="290" y1="490" x2="734" y2="490" stroke="url(#botVisorGrad)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="420" cy="490" r="16" fill="#ffffff"/>
    <circle cx="604" cy="490" r="16" fill="#ffffff"/>

    <!-- 自动化协议核心齿轮/八卦符印象征 (Daemon Automated Core) -->
    <circle cx="512" cy="710" r="70" fill="#0f172a" stroke="#38bdf8" stroke-width="14"/>
    <circle cx="512" cy="710" r="45" fill="url(#botCoreGrad)"/>
    <circle cx="512" cy="710" r="18" fill="#ffffff"/>

    <!-- 核心外围二进制协议射线 (Binary Protocol Beams) -->
    <line x1="512" y1="615" x2="512" y2="635" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <line x1="512" y1="785" x2="512" y2="805" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <line x1="417" y1="710" x2="437" y2="710" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <line x1="587" y1="710" x2="607" y2="710" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
</svg>
